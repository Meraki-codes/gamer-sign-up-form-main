<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Neoncore</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <div class="container">
      <div>
        <div class="header">
          <img src="assets/images/logo.svg" alt="Neoncore Logo" />
        </div>

        <div class="join-nexus">
          <div class="main-text">
            <h1><span class="slash">//</span>JOIN THE NEXUS</h1>
          </div>

          <p>INITIALIZE YOUR NEONCORE IDENTITY</p>
        </div>

        <div class="operator-id-strip">
          <div class="operator-id">
            <p>OPERATOR ID</p>

            <p class="count"><span class="ready-count">0</span>/5 ready</p>
          </div>
          <div>
            <h2 class="operator-name">UNASSIGNED</h2>
            <div class="status-details">
              <div class="status-group">
                <div>
                  <p>CALLSIGN</p>
                  <span></span>
                  <div>PENDING</div>
                </div>
              </div>
              <div class="status-group">
                <div>
                  <p>CALLSIGN</p>
                  <span></span>
                  <div>PENDING</div>
                </div>
              </div>
              <div class="status-group">
                <div>
                  <p>CALLSIGN</p>
                  <span></span>
                  <div>PENDING</div>
                </div>
              </div>
              <div class="status-group">
                <div>
                  <p>CALLSIGN</p>
                  <span></span>
                  <div>PENDING</div>
                </div>
              </div>
              <div class="status-group">
                <div>
                  <p>CALLSIGN</p>
                  <span></span>
                  <div>PENDING</div>
                </div>
              </div>
              <div class="status-group">
                <div>
                  <p>CALLSIGN</p>
                  <span> </span>
                  <div>PENDING</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="signup-form">
        <div class="signup-header">
          <p>NEW OPERATOR</p>
          <p>ALL FIELDS REQUIRED</p>
        </div>
        <div class="signup-group">
          <label for="callsign">&gt; CALLSIGN</label>
          <div class="input-wrapper">
            <input type="text" id="callsign" placeholder="e.g. Vortex_07" />
          </div>
        </div>

        <div class="signup-group">
          <label for="email">&gt; EMAIL</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="you@example.com" />
          </div>
        </div>

        <div class="signup-group">
          <label for="password">&gt; PASSWORD</label>

          <div class="input-wrapper">
            <input type="password" id="password" />
            <span class="show-password"
              ><img src="assets/images/icon-eye.svg" alt=""
            /></span>
          </div>

          <div class="dash-container">
            <span class="dash one"></span>
            <span class="dash two"></span>
            <span class="dash three"></span>
            <span class="dash four"></span>
          </div>

          <small>At least 8 characters</small>
        </div>

        <div class="signup-group">
          <label for="confirm-password">&gt; CONFIRM PASSWORD</label>

          <div class="input-wrapper">
            <input type="password" id="confirm-password" />
            <span class="show-password"
              ><img src="assets/images/icon-eye.svg" alt=""
            /></span>
          </div>
        </div>

        <div class="checkbox-option">
          <input type="checkbox" id="terms" />
          <label for="terms"
            >I accept the <a href="#">Terms</a> and
            <a href="#">Privacy Policy</a></label
          >
        </div>

        <div class="signup-group">
          <button type="submit">Initialize account</button>
        </div>

        <div class="already-user">
          <p>Already an operator?</p>
          <a href="#">Log in</a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
